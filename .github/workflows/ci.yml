name: ci

on:
  push:
  pull_request:

jobs:
  training-controller-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trainctl self-test
        run: python .agents/skills/training-controller/scripts/trainctl.py self-test
